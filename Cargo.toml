[workspace]
members = [".", "codegen"]

[package]
name = "step-io"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Lean STEP (ISO 10303) I/O for 3D CAD applications — reads every mainstream AP, writes only modern AP242."
license = "MIT OR Apache-2.0"
repository = "https://github.com/elgar328/step-io"
readme = "README.md"
keywords = ["step", "iso10303", "cad", "geometry", "parser"]
categories = ["parser-implementations", "science", "encoding"]
# schema/ is codegen input (not read at build time); .github/ is dev CI;
# docs/RELEASING.md is for maintainers.
exclude = ["schema/", ".github/", "docs/RELEASING.md"]

[dependencies]
logos = "0.16"
memchr = "2"

[lints.rust]
# No step-io code uses `unsafe`.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
